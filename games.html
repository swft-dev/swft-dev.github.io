<!DOCTYPE html>

<html>
    <head>
        <link rel="stylesheet" href="style.css">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Swft</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script> 
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    </head>
    <body class="bg-gray-200 flex justify-center w-full h-full">
        <nav>
            <div class="fixed top-0 left-0 w-full grid grid-cols-3 items-center bg-white shadow p-3 px-6"> 
                <img src="https://github.com/swft-dev/swft-dev/blob/main/Photos/swift-logo.png?raw=true" alt="Swift Logo" class="w-24">
                <ul>
                    <li class="hover:opacity-40 transition active:scale-90">
                        <a class="text-xs flex flex-col items-center" href="index.html"><span class="material-symbols-rounded">home</span>Home</a>
                    </li>

                    <li class="hover:opacity-40 transition active:scale-90">
                        <a class="text-xs flex flex-col items-center" href="#"><span class="material-symbols-rounded">handshake</span>Support me</a>
                    </li>

                    <li class="hover:opacity-40 transition active:scale-90">
                        <a class="text-xs flex flex-col items-center" href="games.html"><span class="material-symbols-rounded">stadia_controller</span>Games</a>
                    </li>
                </ul>
            </div>
        </nav>
        <main class="flex justify-center items-center h-screen w-screen flex-col overflow-hidden">
            <section class="shadow-2xl p-10 bg-white flex items-center flex-col text-black  w-1/2">
                <h1 class="w-full font-bold text-2xl">Games</h1>
                <h1 class="font-bold mt-3"><u>Page 01</u></h1>
                <div class="grid grid-cols-3">
                    <a href="games/f-bird.html" class="hover:opacity-80 transition active:scale-95">
                        <img src="https://github.com/swft-dev/swft-dev.github.io/blob/main/images/fish-img.png?raw=true"  height="35" width="100"
                        alt="Character Image" class="rounded-lg">
                        <h1 class="text-xs text-center pb-1">Flappy Fish </h1>
                    </a>
                </div>
                
                <section class="flex justify-between w-full">
                    <a href="#" class="bg-red-400 rounded-lg text-white hover:opacity-80 active:scale-95 transition">
                        <div class="flex border p-5 rounded-lg">
                            <span class="material-symbols-rounded">
                                arrow_back_ios
                            </span>
                            Back
                        </div>
                    </a>
                    
                    <a href="#" class="bg-green-400 rounded-lg text-white hover:opacity-80 active:scale-95 transition">
                        <div class="flex border p-5 rounded-lg">
                            Next
                            <span class="material-symbols-rounded">
                                arrow_forward_ios
                            </span>
                        </div>
                    </a>
                </section>
            </section>
        </main>
        <script src="script.js"></script>
    </body>
</html>
